<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Natureal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #E8F5E9 !important;
        }

        .login-container {
            max-width: 400px;
            margin-top: 100px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="login-container w-100">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='images/Natureal_Logo.jpg') }}" alt="Natureal Logo"
                    style="max-height: 80px;">
                <h3 class="mt-3">Acesso ao Sistema</h3>
            </div>

            <div id="errorBox">
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                {% if category == 'danger' %}
                <div class="alert alert-danger text-center" role="alert">
                    {{ message }}
                </div>
                <script>
                    // Tela com erro aguarda 5 segundos para recarregar sem os dados / mensagem incoreta.
                    setTimeout(function () {
                        window.location.href = "{{ url_for('login') }}";
                    }, 5000);
                </script>
                {% endif %}
                {% endfor %}
                {% endif %}
                {% endwith %}
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Entrar</button>
            </form>
        </div>
    </div>
</body>

</html>
